id: text-trunc-004
repo: textkit
bug_type: off-by-one
difficulty: easy

issue:
  title: 'truncate() returns text longer than the requested width'
  body: |
    ```python
    >>> from textkit import truncate
    >>> truncate("hello world", 8)
    'hello wo…'
    >>> len(_)
    9
    ```

    The width is meant to be a maximum, including the ellipsis, so I expected an
    8-character result like `'hello w…'`. Short strings that fit are returned unchanged.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/textkit/wrap.py
  +++ b/src/textkit/wrap.py
  @@ -23,4 +23,4 @@
           return text
       if width <= len(ellipsis):
           return ellipsis[:width]
  -    return text[: width - len(ellipsis)] + ellipsis
  +    return text[: width - len(ellipsis) + 1] + ellipsis

