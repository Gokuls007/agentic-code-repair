id: inv-sku-007
repo: inventory
bug_type: multi-file
difficulty: hard

issue:
  title: "Lower-case SKUs aren't found"
  body: |
    SKUs are meant to be case-insensitive (`Item("abc-1", ...)` is stored as `ABC-1`),
    but looking them up in lower case fails in several places:

    ```python
    >>> inv.find("abc-1")
    None
    >>> inv.restock("xyz-9", 5)
    KeyError: 'xyz-9'
    >>> stock_summary(inv, ["m-1"])
    {'m-1': None}
    ```

    I expected the Widget item, a successful restock, and `{'m-1': 50}`. Upper-case
    SKUs work everywhere.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/inventory/store.py
  +++ b/src/inventory/store.py
  @@ -25,7 +25,7 @@
   
       def find(self, sku):
           """The item with this SKU (any capitalization), or None."""
  -        return self._items.get(normalize_sku(sku))
  +        return self._items.get(sku)
   
       def restock(self, sku, amount):
           self._require(sku).quantity += amount
  @@ -37,7 +37,7 @@
           item.quantity -= amount
   
       def _require(self, sku):
  -        item = self._items.get(normalize_sku(sku))
  +        item = self._items.get(sku)
           if item is None:
               raise KeyError(sku)
           return item
  --- a/src/inventory/report.py
  +++ b/src/inventory/report.py
  @@ -14,4 +14,4 @@
   def stock_summary(inventory, skus):
       """Map each requested SKU (as given, any capitalization) to its quantity, or None."""
       by_sku = {i.sku: i.quantity for i in inventory.items()}
  -    return {s: by_sku.get(normalize_sku(s)) for s in skus}
  +    return {s: by_sku.get(s) for s in skus}

