id: inv-report-006
repo: inventory
bug_type: api-misuse
difficulty: easy

issue:
  title: "Low-stock report isn't in alphabetical order"
  body: |
    With items named "apple" and "Zebra" both low on stock:

    ```python
    >>> print(low_stock_report(inv))
    Zebra (Z-1): 1
    apple (A-1): 2
    ```

    I expected alphabetical order regardless of capitalization, so "apple" first.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/inventory/report.py
  +++ b/src/inventory/report.py
  @@ -4,7 +4,7 @@
   def low_stock(inventory, threshold=5):
       """Items with quantity at or below threshold, sorted by name ignoring case."""
       items = [i for i in inventory.items() if i.quantity <= threshold]
  -    return sorted(items, key=lambda i: i.name.casefold())
  +    return sorted(items, key=lambda i: i.name)
   
   
   def low_stock_report(inventory, threshold=5):

