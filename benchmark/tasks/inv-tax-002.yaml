id: inv-tax-002
repo: inventory
bug_type: api-misuse
difficulty: medium

issue:
  title: 'Order totals are sometimes a cent short'
  body: |
    Totals are supposed to be rounded half-up to the cent. One $2.50 item with 7% tax:

    ```python
    >>> total([(Item("X-1", "thing", Decimal("2.50")), 1)], 0.07)
    Decimal('2.67')
    ```

    2.50 × 1.07 is exactly 2.675, so I expected `Decimal('2.68')`. Most other totals
    come out right.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/inventory/pricing.py
  +++ b/src/inventory/pricing.py
  @@ -22,7 +22,7 @@
       base = subtotal(lines)
       discounted = base - discount(base)
       taxed = discounted * (1 + Decimal(str(tax_rate)))
  -    return taxed.quantize(CENT, rounding=ROUND_HALF_UP)
  +    return Decimal(str(round(float(taxed), 2)))
   
   
   def format_money(amount):

