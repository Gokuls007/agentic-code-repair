id: inv-discount-001
repo: inventory
bug_type: wrong-conditional
difficulty: easy

issue:
  title: "Orders of exactly $100 don't get the discount"
  body: |
    Orders of $100.00 or more are supposed to get 10% off. An order of two $50.00 items
    gets nothing:

    ```python
    >>> from decimal import Decimal
    >>> from inventory.models import Item
    >>> from inventory.pricing import total
    >>> total([(Item("X-1", "thing", Decimal("50.00")), 2)], 0)
    Decimal('100.00')
    ```

    I expected `Decimal('90.00')`. A $250.00 order is discounted correctly.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/inventory/pricing.py
  +++ b/src/inventory/pricing.py
  @@ -12,7 +12,7 @@
   
   def discount(amount):
       """10% off orders of $100.00 or more."""
  -    if amount >= DISCOUNT_THRESHOLD:
  +    if amount > DISCOUNT_THRESHOLD:
           return (amount * DISCOUNT_RATE).quantize(CENT, rounding=ROUND_HALF_UP)
       return Decimal("0.00")
   

