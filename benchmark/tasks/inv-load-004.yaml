id: inv-load-004
repo: inventory
bug_type: missing-edge-case
difficulty: easy

issue:
  title: "Loading a store that hasn't been saved yet crashes"
  body: |
    On first run there is no store file yet, and `load` crashes:

    ```python
    >>> from inventory.store import load
    >>> load("new-store.json")
    FileNotFoundError: [Errno 2] No such file or directory: 'new-store.json'
    ```

    Its docstring says a missing file means an empty inventory, so I expected an empty
    `Inventory`. Loading an existing file works.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/inventory/store.py
  +++ b/src/inventory/store.py
  @@ -54,7 +54,5 @@
   def load(path):
       """Load an inventory saved with save(). A missing file means an empty inventory."""
       path = Path(path)
  -    if not path.exists():
  -        return Inventory()
       data = json.loads(path.read_text(encoding="utf-8"))
       return Inventory(Item(d["sku"], d["name"], Decimal(d["price"]), d["quantity"]) for d in data)

