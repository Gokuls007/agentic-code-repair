id: inv-stock-003
repo: inventory
bug_type: missing-edge-case
difficulty: easy

issue:
  title: 'Removing more stock than we have goes negative'
  body: |
    ```python
    >>> inv = Inventory([Item("ABC-1", "Widget", Decimal("2.50"), 10)])
    >>> inv.remove_stock("ABC-1", 13)
    >>> inv.find("ABC-1").quantity
    -3
    ```

    I expected `remove_stock` to raise `OutOfStock` and leave the quantity at 10.
    Removing 4 units works fine.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/inventory/store.py
  +++ b/src/inventory/store.py
  @@ -32,8 +32,6 @@
   
       def remove_stock(self, sku, amount):
           item = self._require(sku)
  -        if amount > item.quantity:
  -            raise OutOfStock(f"only {item.quantity} of {item.sku} in stock")
           item.quantity -= amount
   
       def _require(self, sku):

