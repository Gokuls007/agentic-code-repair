id: calc-median-002
repo: calc
bug_type: off-by-one
difficulty: easy

issue:
  title: 'median() is wrong for lists with an even number of values'
  body: |
    `median` works for odd-length lists but not even-length ones:

    ```python
    >>> from calc import median
    >>> median([4, 1, 3, 2])
    3.5
    >>> median([1, 3])
    IndexError: list index out of range
    ```

    I expected 2.5 and 2.0. `median([3, 1, 2])` correctly returns 2.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/calc/stats.py
  +++ b/src/calc/stats.py
  @@ -14,7 +14,7 @@
       mid = len(ordered) // 2
       if len(ordered) % 2:
           return ordered[mid]
  -    return (ordered[mid - 1] + ordered[mid]) / 2
  +    return (ordered[mid] + ordered[mid + 1]) / 2
   
   
   def variance(xs, sample=False):

