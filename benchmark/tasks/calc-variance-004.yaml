id: calc-variance-004
repo: calc
bug_type: missing-edge-case
difficulty: medium

issue:
  title: 'Sample variance of a single value crashes'
  body: |
    The docstring of `variance` says it raises `ValueError` when asked for a sample
    variance with fewer than two values, but instead I get:

    ```python
    >>> from calc import variance
    >>> variance([7], sample=True)
    ZeroDivisionError: float division by zero
    ```

    A `ValueError` with a clear message is what the docs promise. The population
    variance of the same list (`variance([7])`) correctly returns 0.0.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/calc/stats.py
  +++ b/src/calc/stats.py
  @@ -29,8 +29,6 @@
       m = mean(xs)
       ss = sum((x - m) ** 2 for x in xs)
       if sample:
  -        if n < 2:
  -            raise ValueError("sample variance needs at least two values")
           return ss / (n - 1)
       return ss / n
   

