id: text-count-006
repo: textkit
bug_type: api-misuse
difficulty: easy

issue:
  title: 'word_count() miscounts when there is extra whitespace'
  body: |
    ```python
    >>> from textkit import word_count
    >>> word_count("one two  three")
    4
    >>> word_count("")
    1
    ```

    I expected 3 and 0. Text with single spaces between words is counted correctly.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/textkit/case.py
  +++ b/src/textkit/case.py
  @@ -18,4 +18,4 @@
   
   def word_count(text):
       """Number of whitespace-separated words."""
  -    return len(text.split())
  +    return len(text.split(" "))

