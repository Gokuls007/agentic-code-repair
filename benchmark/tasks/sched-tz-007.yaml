id: sched-tz-007
repo: schedule
bug_type: multi-file
difficulty: hard

issue:
  title: 'Timezone-aware scheduling crashes'
  body: |
    Combining the recurrence and duration helpers with timezone-aware datetimes fails:

    ```python
    >>> from datetime import datetime, timedelta, timezone
    >>> from schedule.recur import next_occurrence
    >>> from schedule.durations import time_until
    >>> tz = timezone(timedelta(hours=1))
    >>> nxt = next_occurrence(datetime(2024, 1, 15, 9, tzinfo=tz), datetime(2024, 2, 1, tzinfo=tz))
    >>> nxt.tzinfo is None
    True
    >>> time_until(nxt)
    TypeError: can't subtract offset-naive and offset-aware datetimes
    ```

    The next occurrence should keep the timezone I passed in. And `time_until` also
    fails on its own for plain naive datetimes, e.g.
    `time_until(datetime.now() + timedelta(hours=1))` raises the same TypeError
    instead of returning about an hour.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/schedule/recur.py
  +++ b/src/schedule/recur.py
  @@ -14,5 +14,5 @@
       while True:
           candidate = start + relativedelta(months=i * months)
           if candidate > after:
  -            return candidate
  +            return candidate.replace(tzinfo=None)
           i += 1
  --- a/src/schedule/durations.py
  +++ b/src/schedule/durations.py
  @@ -1,5 +1,5 @@
   import re
  -from datetime import datetime
  +from datetime import datetime, timezone
   
   _PART = re.compile(r"(\d+)([dhms])")
   _FORMAT = re.compile(r"(\d+[dhms])+")
  @@ -18,5 +18,5 @@
       """Time from now until target. `now` defaults to the current time in target's
       timezone (or naive local time for a naive target)."""
       if now is None:
  -        now = datetime.now(target.tzinfo)
  +        now = datetime.now(timezone.utc)
       return target - now

