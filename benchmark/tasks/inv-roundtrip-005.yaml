id: inv-roundtrip-005
repo: inventory
bug_type: wrong-conditional
difficulty: medium

issue:
  title: 'Out-of-stock items disappear after saving'
  body: |
    I saved an inventory with two items, one of which had quantity 0, and loaded it
    back:

    ```python
    >>> save(inv, "store.json")
    >>> [i.sku for i in load("store.json").items()]
    ['ABC-1']
    ```

    The out-of-stock item (`XYZ-9`, quantity 0) is gone. I expected both items back
    with the same quantities.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/inventory/store.py
  +++ b/src/inventory/store.py
  @@ -47,6 +47,7 @@
       data = [
           {"sku": i.sku, "name": i.name, "price": str(i.price), "quantity": i.quantity}
           for i in inventory.items()
  +        if i.quantity
       ]
       Path(path).write_text(json.dumps(data, indent=2), encoding="utf-8")
   

