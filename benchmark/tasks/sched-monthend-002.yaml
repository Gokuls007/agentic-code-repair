id: sched-monthend-002
repo: schedule
bug_type: missing-edge-case
difficulty: hard

issue:
  title: 'Monthly series starting on the 31st gets stuck on a shorter month'
  body: |
    ```python
    >>> monthly(date(2024, 1, 31), 4)
    [datetime.date(2024, 1, 31), datetime.date(2024, 2, 29), datetime.date(2024, 3, 29), datetime.date(2024, 4, 29)]
    ```

    After February the series stays on the 29th. I expected Jan 31, Feb 29, Mar 31,
    Apr 30: the last day of each month when the month is shorter, otherwise the 31st.
    A series starting on the 15th is fine.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/schedule/recur.py
  +++ b/src/schedule/recur.py
  @@ -4,7 +4,10 @@
   def monthly(start, count):
       """count dates one calendar month apart, keeping start's day of month where the month
       allows it (Jan 31 -> Feb 29 -> Mar 31 -> Apr 30)."""
  -    return [start + relativedelta(months=i) for i in range(count)]
  +    dates = [start] if count else []
  +    while len(dates) < count:
  +        dates.append(dates[-1] + relativedelta(months=1))
  +    return dates
   
   
   def next_occurrence(start, after, months=1):

