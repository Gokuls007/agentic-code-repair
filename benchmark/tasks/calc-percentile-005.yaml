id: calc-percentile-005
repo: calc
bug_type: off-by-one
difficulty: medium

issue:
  title: 'percentile() gives shifted results and fails at 100'
  body: |
    ```python
    >>> from calc import percentile
    >>> percentile([10, 20, 30, 40], 50)
    30
    >>> percentile([10, 20, 30, 40], 100)
    IndexError: list index out of range
    ```

    The 50th percentile of that list should be 25 (the same as the median), and the
    100th percentile should be the maximum, 40. `percentile(xs, 0)` does return 10.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/calc/stats.py
  +++ b/src/calc/stats.py
  @@ -42,7 +42,7 @@
       if not 0 <= p <= 100:
           raise ValueError("p must be between 0 and 100")
       ordered = sorted(xs)
  -    rank = (len(ordered) - 1) * p / 100
  +    rank = len(ordered) * p / 100
       low = math.floor(rank)
       high = min(low + 1, len(ordered) - 1)
       return ordered[low] + (ordered[high] - ordered[low]) * (rank - low)

