id: sched-dayfirst-006
repo: schedule
bug_type: api-misuse
difficulty: medium

issue:
  title: 'Day-first (DMY) date parsing reads the month first'
  body: |
    ```python
    >>> from schedule.parse import DateParser
    >>> DateParser("DMY").parse("03/04/2024")
    datetime.date(2024, 3, 4)
    ```

    With the DMY order, 03/04/2024 means 3 April 2024, so I expected
    `datetime.date(2024, 4, 3)`. The default US order (MDY) works.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/schedule/parse.py
  +++ b/src/schedule/parse.py
  @@ -10,4 +10,4 @@
           self.order = order
   
       def parse(self, text):
  -        return parser.parse(text, dayfirst=self.order == "DMY").date()
  +        return parser.parse(text).date()

