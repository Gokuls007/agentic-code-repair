id: calc-clamp-003
repo: calc
bug_type: wrong-conditional
difficulty: easy

issue:
  title: 'clamp() returns the wrong value for almost every input'
  body: |
    `clamp(value, low, high)` should keep a value inside the range, but:

    ```python
    >>> from calc import clamp
    >>> clamp(5, 0, 10)
    0
    >>> clamp(15, 0, 10)
    0
    >>> clamp(-5, 0, 10)
    -5
    ```

    I expected 5, 10 and 0.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/calc/ops.py
  +++ b/src/calc/ops.py
  @@ -9,7 +9,7 @@
   def clamp(value, low, high):
       if low > high:
           raise ValueError("low must not exceed high")
  -    if value < low:
  +    if value > low:
           return low
       if value > high:
           return high

