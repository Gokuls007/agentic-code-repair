id: text-wrap-003
repo: textkit
bug_type: off-by-one
difficulty: medium

issue:
  title: 'wrap() breaks lines that would fit exactly'
  body: |
    ```python
    >>> from textkit import wrap
    >>> wrap("aaa bbb ccc", 7)
    ['aaa', 'bbb', 'ccc']
    ```

    `"aaa bbb"` is exactly 7 characters, so I expected `['aaa bbb', 'ccc']`. Lines that
    are shorter than the width are wrapped correctly.

