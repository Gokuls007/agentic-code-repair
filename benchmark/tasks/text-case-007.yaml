id: text-case-007
repo: textkit
bug_type: multi-file
difficulty: hard

issue:
  title: 'Search is case-sensitive everywhere'
  body: |
    Searching is supposed to ignore case, but both the highlighter and the index are
    case-sensitive:

    ```python
    >>> from textkit import highlight, Index
    >>> highlight("Foo bar FOO", "foo")
    'Foo bar FOO'
    >>> idx = Index()
    >>> idx.add("d1", "Foo Bar")
    >>> idx.lookup("foo"), idx.lookup("FOO")
    ([], [])
    ```

    I expected `'[Foo] bar [FOO]'` and `(['d1'], ['d1'])`. All-lowercase text and
    queries work.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/textkit/tokens.py
  +++ b/src/textkit/tokens.py
  @@ -5,10 +5,10 @@
   
   def tokenize(text):
       """Words in text, case-folded, with their (start, end) character spans."""
  -    return [(m.group().casefold(), m.start(), m.end()) for m in WORD.finditer(text)]
  +    return [(m.group(), m.start(), m.end()) for m in WORD.finditer(text)]
   
   
   def find_spans(text, term):
       """Spans of whole-word, case-insensitive occurrences of term in text."""
  -    needle = term.casefold()
  +    needle = term
       return [(start, end) for word, start, end in tokenize(text) if word == needle]
  --- a/src/textkit/index.py
  +++ b/src/textkit/index.py
  @@ -17,4 +17,4 @@
               self._postings[word].add(doc_id)
   
       def lookup(self, term):
  -        return sorted(self._postings.get(term.casefold(), set()))
  +        return sorted(self._postings.get(term, set()))

