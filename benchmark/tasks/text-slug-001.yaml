id: text-slug-001
repo: textkit
bug_type: missing-edge-case
difficulty: easy

issue:
  title: 'slugify() produces repeated dashes'
  body: |
    ```python
    >>> from textkit import slugify
    >>> slugify("Hello,  World!")
    'hello---world'
    ```

    I expected `'hello-world'`: any run of punctuation or spaces should turn into a
    single dash. `slugify("Hello World")` gives `'hello-world'` as expected.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/textkit/slug.py
  +++ b/src/textkit/slug.py
  @@ -7,5 +7,5 @@
       non-alphanumeric characters replaced by a single separator."""
       normalized = unicodedata.normalize("NFKD", text)
       ascii_text = normalized.encode("ascii", "ignore").decode("ascii")
  -    words = re.split(r"[^a-z0-9]+", ascii_text.lower())
  -    return sep.join(w for w in words if w)
  +    words = re.split(r"[^a-z0-9]", ascii_text.lower())
  +    return sep.join(words).strip(sep)

