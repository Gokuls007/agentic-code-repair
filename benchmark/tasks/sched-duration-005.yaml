id: sched-duration-005
repo: schedule
bug_type: missing-edge-case
difficulty: medium

issue:
  title: 'parse_duration() ignores everything after the first unit'
  body: |
    ```python
    >>> from schedule.durations import parse_duration
    >>> parse_duration("1h30m")
    3600
    >>> parse_duration("1d2h3m4s")
    86400
    ```

    I expected 5400 and 93784 seconds. Single-unit durations such as `"45m"` or `"2d"`
    are parsed correctly.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/schedule/durations.py
  +++ b/src/schedule/durations.py
  @@ -11,7 +11,8 @@
       text = text.strip().lower()
       if not _FORMAT.fullmatch(text):
           raise ValueError(f"invalid duration: {text!r}")
  -    return sum(int(amount) * _SECONDS[unit] for amount, unit in _PART.findall(text))
  +    amount, unit = _PART.search(text).groups()
  +    return int(amount) * _SECONDS[unit]
   
   
