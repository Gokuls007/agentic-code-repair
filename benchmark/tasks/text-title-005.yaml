id: text-title-005
repo: textkit
bug_type: wrong-conditional
difficulty: easy

issue:
  title: 'title_case() leaves the first word lowercase'
  body: |
    ```python
    >>> from textkit import title_case
    >>> title_case("the lord of the rings")
    'the Lord of the Rings'
    ```

    I expected `'The Lord of the Rings'`: a title should always start with a capital,
    even when the first word is a short one like "the". The small words in the middle
    are handled correctly.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/textkit/case.py
  +++ b/src/textkit/case.py
  @@ -9,7 +9,7 @@
       out = []
       for i, word in enumerate(words):
           lower = word.lower()
  -        if 0 < i < len(words) - 1 and lower in SMALL_WORDS:
  +        if i < len(words) - 1 and lower in SMALL_WORDS:
               out.append(lower)
           else:
               out.append(lower[:1].upper() + lower[1:])

