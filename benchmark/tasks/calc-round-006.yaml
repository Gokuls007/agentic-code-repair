id: calc-round-006
repo: calc
bug_type: api-misuse
difficulty: medium

issue:
  title: "round_half_up() doesn't round halves up"
  body: |
    `round_half_up` is documented to round halves away from zero, but:

    ```python
    >>> from calc import round_half_up
    >>> round_half_up(2.5)
    2
    >>> round_half_up(-2.5)
    -2
    >>> round_half_up(0.125, 2)
    0.12
    ```

    I expected 3, -3 and 0.13. Values that aren't exactly halfway round correctly.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/calc/rounding.py
  +++ b/src/calc/rounding.py
  @@ -6,6 +6,4 @@
   
       Returns an int when ndigits is 0, otherwise a float.
       """
  -    quantum = Decimal(1).scaleb(-ndigits)
  -    result = Decimal(str(value)).quantize(quantum, rounding=ROUND_HALF_UP)
  -    return float(result) if ndigits else int(result)
  +    return round(value, ndigits) if ndigits else round(value)

