id: sched-monthly-001
repo: schedule
bug_type: api-misuse
difficulty: medium

issue:
  title: 'Monthly dates drift off the start day'
  body: |
    ```python
    >>> from datetime import date
    >>> from schedule.recur import monthly
    >>> monthly(date(2024, 1, 15), 3)
    [datetime.date(2024, 1, 15), datetime.date(2024, 2, 14), datetime.date(2024, 3, 15)]
    >>> monthly(date(2023, 12, 10), 2)
    [datetime.date(2023, 12, 10), datetime.date(2024, 1, 9)]
    ```

    I expected the same day of every month: Jan 15, Feb 15, Mar 15, and Dec 10, Jan 10.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
seed_patch: |
  --- a/src/schedule/recur.py
  +++ b/src/schedule/recur.py
  @@ -1,10 +1,12 @@
  +from datetime import timedelta
  +
   from dateutil.relativedelta import relativedelta
   
   
   def monthly(start, count):
       """count dates one calendar month apart, keeping start's day of month where the month
       allows it (Jan 31 -> Feb 29 -> Mar 31 -> Apr 30)."""
  -    return [start + relativedelta(months=i) for i in range(count)]
  +    return [start + timedelta(days=30 * i) for i in range(count)]
   
   
   def next_occurrence(start, after, months=1):

