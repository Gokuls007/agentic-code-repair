id: sched-bizdays-003
repo: schedule
bug_type: off-by-one
difficulty: medium

issue:
  title: 'add_business_days() goes one day too far'
  body: |
    ```python
    >>> from datetime import date
    >>> from schedule.business import add_business_days
    >>> add_business_days(date(2024, 3, 1), 1)   # Friday
    datetime.date(2024, 3, 5)
    >>> add_business_days(date(2024, 3, 1), 0)
    datetime.date(2024, 3, 4)
    ```

    One business day after Friday, March 1 should be Monday, March 4, and adding zero
    days should return the same date.

# Plants the bug in an otherwise-correct repo (generated diff; do not hand-edit).
