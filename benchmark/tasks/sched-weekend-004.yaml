issue:
  title: 'Saturdays are treated as business days'
  body: |
    ```python
    >>> from datetime import date
    >>> from schedule.business import is_business_day, add_business_days
    >>> is_business_day(date(2024, 3, 2))   # a Saturday
    True
    >>> add_business_days(date(2024, 3, 1), 1)   # Friday
    datetime.date(2024, 3, 2)
    ```

    I expected False, and Monday, March 4. Sundays are correctly excluded.

